name: 🐞 Informar de un fallo
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **Si es un problema de seguridad, no lo publiques aquí**: sigue la política de seguridad (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Describe el fallo y su impacto.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a…
        2. Pulsar en…
        3. Ver el error…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Desarrollo
        - Staging
        - Producción
        - Local
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Más contexto
      description: Versión, navegador, logs, capturas…
